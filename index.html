<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPanel Vault</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<style>
:root{
--bg:#0b0a09;
--text:#fff6ea;
--muted:#c3b09a;
--line:rgba(255,186,92,.22);
--gold:#ffb43a;
--mint:#3ee39a;
--ink:#140f0a
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Lalezar,Tahoma;
color:var(--text);
background:
radial-gradient(circle at 12% 0%,rgba(255,180,58,.23),transparent 32%),
radial-gradient(circle at 88% 30%,rgba(62,227,154,.11),transparent 30%),
linear-gradient(180deg,#120e0b,#070605)
}

.wrap{
width:min(720px,calc(100% - 30px));
margin:auto;
padding:55px 0
}

.card{
padding:22px;
border-radius:22px;
border:1px solid var(--line);
background:
linear-gradient(
145deg,
rgba(255,255,255,.095),
rgba(255,180,58,.065),
rgba(255,255,255,.025)
);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
box-shadow:
0 28px 70px rgba(0,0,0,.55),
inset 0 1px 0 rgba(255,255,255,.08);
text-align:center
}

.gold{color:var(--gold)}

input{
width:100%;
padding:11px;
border-radius:12px;
border:1px solid var(--line);
background:rgba(255,255,255,.055);
backdrop-filter:blur(10px);
color:var(--text);
font:16px Lalezar;
outline:none
}

.btn{
border:0;
cursor:pointer;
border-radius:16px;
padding:12px 18px;
font:16px Lalezar;
margin:5px;
box-shadow:0 5px 0 rgba(0,0,0,.3)
}

.goldbtn{
background:linear-gradient(180deg,#ffd27a,#ff9d1f);
color:var(--ink)
}

.mint{
background:linear-gradient(180deg,#6af3b8,#17c77a);
color:#042016
}

.ghost{
background:rgba(255,255,255,.06);
color:var(--text);
border:1px solid var(--line);
box-shadow:none
}

.rose{
background:linear-gradient(180deg,#ff8a97,#e23b4d);
color:#fff
}

.hidden{
display:none!important
}

.muted{
color:var(--muted)
}

.status{
margin:14px 0;
color:var(--muted);
min-height:28px
}

.token{
direction:ltr;
text-align:left;
word-break:break-all;
padding:10px;
border-radius:11px;
background:rgba(255,255,255,.045);
backdrop-filter:blur(10px);
margin:8px 0;
border:1px solid rgba(255,186,92,.10)
}

.spinner{
display:inline-block;
width:16px;
height:16px;
border:2px solid rgba(0,0,0,.25);
border-top-color:#111;
border-radius:50%;
animation:spin .7s linear infinite;
vertical-align:-3px
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.actions{
display:flex;
justify-content:center;
flex-wrap:wrap
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translate(-50%,22px) scale(.96);
padding:12px 18px;
border-radius:12px;
background:rgba(23,18,13,.68);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid var(--line);
box-shadow:0 18px 45px rgba(0,0,0,.35);
z-index:5;
opacity:0;
animation:toastIn .55s cubic-bezier(.22,1,.36,1) forwards
}

.toast.hide{
animation:toastOut .55s cubic-bezier(.55,0,.78,.18) forwards
}

@keyframes toastIn{
to{
opacity:1;
transform:translate(-50%,0) scale(1)
}
}

@keyframes toastOut{
to{
opacity:0;
transform:translate(-50%,18px) scale(.94)
}
}

.ok{color:#9dffc9}
.err{color:#ffb0b7}

button,a,input{
transition:
transform .5s cubic-bezier(.22,1,.36,1),
opacity .5s ease,
border-color .5s ease,
box-shadow .5s ease,
background .5s ease
}

button:not(:disabled):hover,
a.btn:hover{
transform:translateY(-3px)
}

button:disabled{
opacity:.55;
cursor:wait
}

.bi{
display:inline-block;
vertical-align:-.12em;
margin-inline-end:6px
}

/* Secret editor */

.secret-editor{
margin-top:15px;
padding-top:15px;
border-top:1px solid var(--line);
text-align:right
}

.secret-row{
display:flex;
align-items:center;
gap:8px;
margin:8px 0
}

.secret-name{
width:155px;
flex-shrink:0;
direction:ltr;
text-align:left;
font-size:14px;
color:var(--muted)
}

.secret-row input{
flex:1;
font-size:14px
}

@media(max-width:600px){

.secret-row{
flex-direction:column;
align-items:stretch
}

.secret-name{
width:100%;
text-align:right
}

}

/* Custom Alert / Confirm */

.custom-dialog{
position:fixed;
inset:0;
background:rgba(8,6,4,.68);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
display:flex;
align-items:center;
justify-content:center;
z-index:150;
animation:dialogIn .35s cubic-bezier(.22,1,.36,1)
}

.custom-dialog.hidden{
display:none
}

.custom-dialog.closing{
animation:dialogOut .3s cubic-bezier(.55,0,.78,.18) forwards
}

.custom-dialog-box{
width:min(500px,calc(100% - 30px));
padding:21px;
border-radius:20px;
border:1px solid var(--line);
background:rgba(22,17,12,.78);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
box-shadow:
0 28px 80px rgba(0,0,0,.55),
inset 0 1px 0 rgba(255,255,255,.08);
animation:dialogBoxIn .4s cubic-bezier(.22,1,.36,1)
}

.custom-dialog.closing .custom-dialog-box{
animation:dialogBoxOut .3s cubic-bezier(.55,0,.78,.18) forwards
}

.dialog-title{
margin:0 0 8px;
font-size:23px
}

.dialog-message{
color:var(--muted);
line-height:1.9;
white-space:pre-wrap
}

.dialog-icon{
font-size:25px;
vertical-align:-.12em;
margin-inline-end:7px
}

.dialog-actions{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:17px
}

@keyframes dialogIn{
from{opacity:0}
to{opacity:1}
}

@keyframes dialogOut{
from{opacity:1}
to{opacity:0}
}

@keyframes dialogBoxIn{
from{
opacity:0;
transform:translateY(18px) scale(.96)
}
to{
opacity:1;
transform:none
}
}

@keyframes dialogBoxOut{
to{
opacity:0;
transform:translateY(16px) scale(.96)
}
}
</style>
</head>

<body>

<div class="wrap">

<!-- LOGIN -->

<div id="loginCard" class="card">

<h1>
<span class="gold">H</span>Panel Vault
</h1>

<p class="muted">
رمز گاوصندوق را وارد کنید
</p>

<input
id="pass"
type="password"
placeholder="رمز ورود"
autocomplete="current-password"
>

<button
id="login"
class="btn goldbtn"
onclick="unlock()"
>
<i class="bi bi-unlock"></i>
ورود
</button>

<p id="status" class="status"></p>

</div>


<!-- SESSION -->

<div id="sessionCard" class="card hidden">

<h1>
<span class="gold">H</span>Panel Vault
</h1>

<p id="sessionText" class="muted"></p>


<div class="actions">

<button
class="btn rose"
onclick="askLogout()"
>
<i class="bi bi-box-arrow-right"></i>
بله، خروج
</button>

<button
class="btn ghost"
onclick="cancelLogout()"
>
<i class="bi bi-x-lg"></i>
خیر
</button>

<button
id="viewBtn"
class="btn goldbtn hidden"
onclick="showTokens()"
>
<i class="bi bi-key"></i>
مشاهده توکن‌ها
</button>

<button
id="secretBtn"
class="btn mint hidden"
onclick="toggleSecrets()"
>
<i class="bi bi-pencil-square"></i>
ویرایش Secrets
</button>

<button
id="buildBtn"
class="btn mint hidden"
onclick="buildVault()"
>
<i class="bi bi-play-fill"></i>
اجرای Build Vault
</button>

</div>


<!-- TOKENS -->

<div id="tokens" class="hidden"></div>


<!-- SECRET EDITOR -->

<div
id="secretEditor"
class="secret-editor hidden"
>

<h2>
<span class="gold">مدیریت Secrets</span>
</h2>

<p class="muted">
برای تغییر هر Secret مقدار جدید را وارد کنید.
قسمت‌های خالی تغییر نمی‌کنند.
</p>


<div class="secret-row">

<div class="secret-name">
VAULT_PASSWORD
</div>

<input
id="s_vault_password"
type="password"
placeholder="مقدار جدید"
>

</div>


<div class="secret-row">

<div class="secret-name">
DASHBOARD_TOKEN
</div>

<input
id="s_dashboard"
type="password"
placeholder="مقدار جدید"
>

</div>


<div class="secret-row">

<div class="secret-name">
RADIO_TOKEN
</div>

<input
id="s_radio"
type="password"
placeholder="مقدار جدید"
>

</div>


<div class="secret-row">

<div class="secret-name">
VAULT_TOKEN
</div>

<input
id="s_vault_token"
type="password"
placeholder="مقدار جدید"
>

</div>


<div class="actions">

<button
id="saveSecretsBtn"
class="btn goldbtn"
onclick="saveSecrets()"
>
<i class="bi bi-cloud-arrow-up"></i>
ذخیره Secrets
</button>

</div>

<p id="secretStatus" class="status"></p>

</div>


<br>


<a
class="btn mint"
href="https://herculepanel.github.io/"
>
<i class="bi bi-house"></i>
منوی اصلی
</a>

</div>

</div>


<!-- CUSTOM DIALOG -->

<div
id="customDialog"
class="custom-dialog hidden"
>

<div class="custom-dialog-box">

<h2
id="dialogTitle"
class="dialog-title"
></h2>

<div
id="dialogMessage"
class="dialog-message"
></div>

<div
id="dialogActions"
class="dialog-actions"
></div>

</div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const CONFIG={
owner:"HerculePanel",
repo:"vault",
branch:"main",
workflow:"built-vault.yml",
vaultFile:"vault.enc.json"
};


const AUTH_KEY="hpanel_auth";
const ITEMS_KEY="hpanel_vault_items";
const VAULT_TOKEN_KEY="hpanel_vault_token";

const KEYS={
dash:"hpanel_dashboard_token",
radio:"hpanel_radio_token"
};


let current=null;
let items=[];
let apiToken="";


/* =========================================================
   TOAST
========================================================= */

function toast(t,c=""){

const x=document.createElement("div");

x.className="toast "+c;
x.textContent=t;

document.body.appendChild(x);

setTimeout(()=>{

x.classList.add("hide");

setTimeout(()=>{
x.remove();
},550);

},3200);

}


/* =========================================================
   CUSTOM DIALOG
========================================================= */

function closeCustomDialog(){

const d=document.getElementById("customDialog");

if(d.classList.contains("hidden"))
return;

d.classList.add("closing");

setTimeout(()=>{

d.classList.add("hidden");
d.classList.remove("closing");

},300);

}


function customAlert(
message,
title="پیام",
type="info"
){

return new Promise(resolve=>{

const d=document.getElementById("customDialog");
const t=document.getElementById("dialogTitle");
const m=document.getElementById("dialogMessage");
const a=document.getElementById("dialogActions");

const icons={
info:"bi-info-circle",
success:"bi-check-circle",
error:"bi-exclamation-triangle",
warning:"bi-exclamation-triangle"
};

const buttonClass=
type==="error"||type==="warning"
?"rose"
:"mint";

t.innerHTML=
`<i class="bi ${icons[type]||icons.info} dialog-icon"></i>${esc(title)}`;

m.textContent=message;

a.innerHTML=`
<button class="btn ${buttonClass}" id="dialogOK">
<i class="bi bi-check-lg"></i>
باشه
</button>
`;

d.classList.remove("hidden","closing");

document.getElementById("dialogOK").onclick=()=>{

closeCustomDialog();

setTimeout(()=>{
resolve();
},300);

};

});

}


function customConfirm(
message,
title="تأیید"
){

return new Promise(resolve=>{

const d=document.getElementById("customDialog");
const t=document.getElementById("dialogTitle");
const m=document.getElementById("dialogMessage");
const a=document.getElementById("dialogActions");

t.innerHTML=
`<i class="bi bi-question-circle dialog-icon"></i>${esc(title)}`;

m.textContent=message;

a.innerHTML=`

<button class="btn mint" id="dialogYes">
<i class="bi bi-check-lg"></i>
بله
</button>

<button class="btn ghost" id="dialogNo">
<i class="bi bi-x-lg"></i>
خیر
</button>

`;

d.classList.remove("hidden","closing");


document.getElementById("dialogYes").onclick=()=>{

closeCustomDialog();

setTimeout(()=>{
resolve(true);
},300);

};


document.getElementById("dialogNo").onclick=()=>{

closeCustomDialog();

setTimeout(()=>{
resolve(false);
},300);

};

});

}


/* =========================================================
   BASE64
========================================================= */

function b64(s){

const bin=atob(s);

const a=new Uint8Array(bin.length);

for(let i=0;i<bin.length;i++)
a[i]=bin.charCodeAt(i);

return a;

}


/* =========================================================
   VAULT DECRYPTION
========================================================= */

async function keyFor(p,salt){

const m=
await crypto.subtle.importKey(
"raw",
new TextEncoder().encode(p),
"PBKDF2",
false,
["deriveBits"]
);

const bits=
await crypto.subtle.deriveBits(
{
name:"PBKDF2",
salt,
iterations:100000,
hash:"SHA-256"
},
m,
256
);

return new Uint8Array(bits);

}


async function decrypt(p,pack){

const k=
await keyFor(
p,
b64(pack.salt)
);

const b=
b64(pack.blob);

const raw=
new Uint8Array(b.length);

for(let i=0;i<b.length;i++)
raw[i]=b[i]^k[i%32];

return JSON.parse(
new TextDecoder().decode(raw)
);

}


async function loadPack(){

const r=
await fetch(
CONFIG.vaultFile+"?t="+Date.now(),
{
cache:"no-store"
}
);

if(!r.ok)
throw Error("فایل Vault پیدا نشد");

return r.json();

}


/* =========================================================
   AUTH STORAGE
========================================================= */

function saveAuth(admin,data){

localStorage.setItem(
AUTH_KEY,
JSON.stringify({
loggedIn:true,
admin:!!admin,
at:Date.now()
})
);


if(data?.items){

localStorage.setItem(
ITEMS_KEY,
JSON.stringify(data.items)
);


for(const x of data.items){

if(!x||!x.token)
continue;

const n=
String(x.name||"").toLowerCase();


if(n.includes("radio")){

localStorage.setItem(
KEYS.radio,
x.token
);

}


else if(n.includes("dash")){

localStorage.setItem(
KEYS.dash,
x.token
);

}

}

}

}


function getAuth(){

try{

return JSON.parse(
localStorage.getItem(
AUTH_KEY
)||"null"
);

}catch{

return null;

}

}


/* =========================================================
   SESSION UI
========================================================= */

function showSession(a){

current=a;

document
.getElementById("loginCard")
.classList
.add("hidden");

document
.getElementById("sessionCard")
.classList
.remove("hidden");

document
.getElementById("sessionText")
.textContent=
a.admin
?"شما به عنوان مدیر وارد شده‌اید. از حساب خارج شوید؟"
:"شما وارد شده‌اید. از حساب خارج شوید؟";


document
.getElementById("viewBtn")
.classList
.toggle(
"hidden",
!a.admin
);

document
.getElementById("secretBtn")
.classList
.toggle(
"hidden",
!a.admin
);

document
.getElementById("buildBtn")
.classList
.toggle(
"hidden",
!a.admin
);

}


/* =========================================================
   LOGIN
========================================================= */

async function unlock(){

const entered=
document
.getElementById("pass")
.value
.trim();

if(!entered){

toast(
"رمز را وارد کن",
"err"
);

return;

}


const admin=
entered.endsWith("_thisisadmin");


const base=
admin
?entered.slice(
0,
-"_thisisadmin".length
)
:entered;


const btn=
document.getElementById("login");

btn.disabled=true;

btn.innerHTML=
`<i class="bi bi-hourglass-split"></i>
در حال بررسی
<span class="spinner"></span>`;


try{

const pack=
await loadPack();

const data=
await decrypt(
base,
pack
);


items=
Array.isArray(data.items)
?data.items
:[];


/*
 * Admin receives the VAULT_TOKEN.
 */

if(admin){

apiToken=data.dispatch||"";


if(!apiToken){

throw Error(
"VAULT_TOKEN در Vault پیدا نشد"
);

}


/*
 * IMPORTANT:
 * Save admin API token separately.
 */

localStorage.setItem(
VAULT_TOKEN_KEY,
apiToken
);

localStorage.setItem(
ITEMS_KEY,
JSON.stringify(items)
);

}


/*
 * Normal users don't receive the API token.
 */

saveAuth(
admin,
data
);


showSession({
admin
});


toast(
"ورود موفق بود",
"ok"
);


document
.getElementById("pass")
.value="";


}catch(e){

toast(
e.message||"رمز اشتباه است",
"err"
);

}finally{

btn.disabled=false;

btn.innerHTML=
`<i class="bi bi-unlock"></i>
ورود`;

}

}


/* =========================================================
   TOKEN VIEWER
========================================================= */

function showTokens(){

if(!current?.admin)
return;


const box=
document.getElementById("tokens");


box.classList.remove("hidden");


box.innerHTML=
items.length

?items.map(x=>`

<div>

<b>
<i class="bi bi-key-fill"></i>
${esc(x.name||"توکن")}
</b>

<div class="token">
${esc(x.token||"")}
</div>

</div>

`).join("")

:`

<p class="muted">
<i class="bi bi-info-circle"></i>
توکنی پیدا نشد.
</p>

`;

}


/* =========================================================
   SECRET EDITOR
========================================================= */

function toggleSecrets(){

if(!current?.admin)
return;


document
.getElementById("secretEditor")
.classList
.toggle("hidden");

}


async function getPublicKey(){

const url=
`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/actions/secrets/public-key`;


const r=
await fetch(
url,
{
headers:{
"Authorization":
"Bearer "+apiToken,

"Accept":
"application/vnd.github+json",

"X-GitHub-Api-Version":
"2022-11-28"
}
}
);


let data={};

try{
data=await r.json();
}catch{}


if(!r.ok){

throw Error(
data.message||
"دریافت کلید GitHub ناموفق بود"
);

}


return data;

}


async function encryptSecret(
value,
publicKey
){

await sodium.ready;


const keyBytes=
sodium.from_base64(
publicKey.key,
sodium.base64_variants.ORIGINAL
);


const encrypted=
sodium.crypto_box_seal(
new TextEncoder().encode(value),
keyBytes
);


return sodium.to_base64(
encrypted,
sodium.base64_variants.ORIGINAL
);

}


async function updateSecret(
name,
value,
publicKey
){

const encrypted=
await encryptSecret(
value,
publicKey
);


const url=
`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/actions/secrets/${name}`;


const r=
await fetch(
url,
{
method:"PUT",

headers:{
"Authorization":
"Bearer "+apiToken,

"Accept":
"application/vnd.github+json",

"X-GitHub-Api-Version":
"2022-11-28",

"Content-Type":
"application/json"
},

body:JSON.stringify({
encrypted_value:encrypted,
key_id:publicKey.key_id
})
}
);


let data={};

try{
data=await r.json();
}catch{}


if(!r.ok){

throw Error(
data.message||
`خطا در ذخیره ${name}`
);

}

}


async function saveSecrets(){

if(!current?.admin)
return;


const values={

VAULT_PASSWORD:
document.getElementById(
"s_vault_password"
).value,

DASHBOARD_TOKEN:
document.getElementById(
"s_dashboard"
).value,

RADIO_TOKEN:
document.getElementById(
"s_radio"
).value,

VAULT_TOKEN:
document.getElementById(
"s_vault_token"
).value

};


const changed=
Object.values(values)
.some(v=>v.length>0);


if(!changed){

toast(
"حداقل یک Secret را وارد کنید",
"err"
);

return;

}


const btn=
document.getElementById(
"saveSecretsBtn"
);

btn.disabled=true;

btn.innerHTML=
`<i class="bi bi-hourglass-split"></i>
در حال ذخیره
<span class="spinner"></span>`;


try{

const publicKey=
await getPublicKey();

let count=0;


for(const name of Object.keys(values)){

const value=values[name];

if(!value)
continue;


document
.getElementById("secretStatus")
.textContent=
`در حال ذخیره ${name}...`;


await updateSecret(
name,
value,
publicKey
);

count++;

}


/*
 * If the admin changed VAULT_TOKEN,
 * immediately switch to the new token.
 */

if(values.VAULT_TOKEN){

apiToken=
values.VAULT_TOKEN;

localStorage.setItem(
VAULT_TOKEN_KEY,
apiToken
);

}


document.getElementById(
"s_vault_password"
).value="";

document.getElementById(
"s_dashboard"
).value="";

document.getElementById(
"s_radio"
).value="";

document.getElementById(
"s_vault_token"
).value="";


document
.getElementById("secretStatus")
.textContent=
`${count} Secret با موفقیت ذخیره شد`;

document
.getElementById("secretStatus")
.className=
"status ok";


toast(
"Secrets با موفقیت ذخیره شدند",
"ok"
);


}catch(e){

document
.getElementById("secretStatus")
.textContent=
e.message||"خطا در ذخیره Secrets";

document
.getElementById("secretStatus")
.className=
"status err";


toast(
e.message||"خطا در ذخیره Secrets",
"err"
);

}finally{

btn.disabled=false;

btn.innerHTML=
`<i class="bi bi-cloud-arrow-up"></i>
ذخیره Secrets`;

}

}


/* =========================================================
   BUILD VAULT WORKFLOW
========================================================= */

async function buildVault(){

if(!current?.admin)
return;


const confirmed=
await customConfirm(
"Workflow مربوط به Build Vault اجرا شود؟",
"اجرای Build Vault"
);


if(!confirmed)
return;


try{

toast(
"در حال اجرای Workflow...",
"ok"
);


const url=
`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/actions/workflows/${CONFIG.workflow}/dispatches`;


const r=
await fetch(
url,
{
method:"POST",

headers:{
"Authorization":
"Bearer "+apiToken,

"Accept":
"application/vnd.github+json",

"X-GitHub-Api-Version":
"2022-11-28",

"Content-Type":
"application/json"
},

body:JSON.stringify({
ref:CONFIG.branch
})
}
);


if(!r.ok){

let data={};

try{
data=await r.json();
}catch{}


throw Error(
data.message||
"اجرای Workflow ناموفق بود"
);

}


toast(
"Build Vault با موفقیت اجرا شد",
"ok"
);


}catch(e){

toast(
e.message||"خطا در اجرای Workflow",
"err"
);

}

}

/* =========================================================
   ESCAPE
========================================================= */

function esc(s){

return String(s??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================================
   RESTORE ADMIN SESSION
========================================================= */

(function restore(){

const a=
getAuth();


if(!a?.loggedIn)
return;


/*
 * Normal users can restore their UI.
 */

if(!a.admin){

showSession({
admin:false
});

return;

}


/*
 * Admin requires the saved VAULT_TOKEN.
 */

const savedToken=
localStorage.getItem(
VAULT_TOKEN_KEY
);


const savedItems=
localStorage.getItem(
ITEMS_KEY
);


if(!savedToken){

/*
 * Admin flag exists but API token doesn't.
 * Force a new login.
 */

localStorage.removeItem(
AUTH_KEY
);

return;

}


apiToken=savedToken;


if(savedItems){

try{

items=
JSON.parse(savedItems)||[];

}catch{

items=[];

}

}


showSession({
admin:true
});


})();
