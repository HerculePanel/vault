<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPanel Vault</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Lalezar,Arial,sans-serif;
    background:
        radial-gradient(circle at 20% 10%,rgba(255,193,7,.12),transparent 28%),
        radial-gradient(circle at 90% 90%,rgba(0,140,255,.10),transparent 30%),
        #080b12;
    color:#eee;
}

.wrap{
    width:min(430px,calc(100% - 28px));
    min-height:100vh;
    margin:auto;
    padding:18px 0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card{
    width:100%;
    padding:15px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:17px;
    background:rgba(20,24,34,.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 18px 50px rgba(0,0,0,.35);
}

.brand{
    margin:0;
    text-align:center;
    font-size:25px;
    line-height:1.1;
}

.gold{color:#ffc107}

.subtitle{
    text-align:center;
    color:#9da5b4;
    font-size:12px;
    margin:6px 0 15px;
}

input{
    width:100%;
    border:1px solid rgba(255,255,255,.10);
    outline:none;
    background:rgba(255,255,255,.055);
    color:#fff;
    border-radius:10px;
    padding:9px 11px;
    font-family:inherit;
    font-size:12px;
}

input:focus{
    border-color:rgba(255,193,7,.55);
}

.btn{
    border:0;
    border-radius:10px;
    padding:8px 11px;
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
    color:#fff;
    background:rgba(255,255,255,.08);
    transition:.15s;
}

.btn:hover{
    transform:translateY(-1px);
    background:rgba(255,255,255,.13);
}

.btn.goldBtn{
    background:#c99600;
    color:#111;
}

.btn.goldBtn:hover{
    background:#e0ad00;
}

.btn.red{
    background:rgba(220,50,50,.18);
    color:#ff9b9b;
}

.btn.blue{
    background:rgba(30,120,255,.18);
    color:#8fc2ff;
}

.row{
    display:flex;
    gap:7px;
    margin-top:8px;
}

.row .btn{
    flex:1;
}

.hidden{display:none!important}

.status{
    text-align:center;
    font-size:12px;
    margin:10px 0;
    min-height:18px;
}

.success{color:#72e6a1}
.error{color:#ff7777}
.muted{color:#9da5b4}

.token-box{
    margin-top:10px;
    padding:10px;
    border-radius:12px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
}

.token-name{
    font-size:13px;
    margin-bottom:4px;
}

.token{
    direction:ltr;
    text-align:left;
    word-break:break-all;
    font-family:monospace;
    font-size:9px;
    color:#bbb;
    background:rgba(0,0,0,.2);
    border-radius:7px;
    padding:7px;
}

.section{
    margin-top:13px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.07);
}

.section-title{
    font-size:14px;
    margin-bottom:7px;
}

.secret-grid{
    display:grid;
    gap:7px;
}

.secret-item{
    display:flex;
    gap:7px;
    align-items:center;
}

.secret-item .name{
    width:115px;
    flex-shrink:0;
    font-size:11px;
    color:#bbb;
    direction:ltr;
    text-align:left;
}

.secret-item input{
    flex:1;
}

.footer{
    text-align:center;
    color:#687080;
    font-size:10px;
    margin-top:12px;
}

@media(max-width:520px){
    .wrap{
        width:calc(100% - 28px);
        padding:16px 0;
    }

    .card{
        padding:13px;
        border-radius:16px;
    }

    .brand{font-size:23px}
    .subtitle{font-size:11px}
    .btn{font-size:11px;padding:7px 10px}
    input{font-size:12px;padding:8px}
    .secret-item .name{width:100px}
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<h1 class="brand">
    <span class="gold">H</span><span class="gold">P</span>anel
    <span class="gold">V</span>ault
</h1>

<div class="subtitle">مدیریت امن توکن‌های HPanel</div>

<div id="loginBox">

    <input
        id="password"
        type="password"
        placeholder="رمز ورود"
        autocomplete="off"
    >

    <div class="row">
        <button class="btn goldBtn" onclick="login()">
            <i class="bi bi-box-arrow-in-left"></i>
            ورود
        </button>
    </div>

    <div id="loginStatus" class="status"></div>
</div>

<div id="panel" class="hidden">

    <div id="sessionStatus" class="status success"></div>

    <div class="row">
        <button class="btn blue" onclick="showTokens()">
            <i class="bi bi-key"></i>
            نمایش توکن‌ها
        </button>

        <button class="btn red" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>
            خروج
        </button>
    </div>

    <div id="tokens" class="section hidden">
        <div class="section-title">
            <i class="bi bi-shield-lock"></i>
            توکن‌ها
        </div>

        <div id="tokenList"></div>
    </div>

    <div id="adminSection" class="section hidden">

        <div class="section-title">
            <span class="gold">پنل مدیریت</span>
        </div>

        <div class="row">
            <button class="btn goldBtn" onclick="openSecrets()">
                <i class="bi bi-pencil-square"></i>
                ویرایش Secrets
            </button>

            <button class="btn blue" onclick="buildVault()">
                <i class="bi bi-play-fill"></i>
                اجرای Build Vault
            </button>
        </div>

        <div id="secretEditor" class="section hidden">

            <div class="section-title">
                ویرایش Secrets
            </div>

            <div class="secret-grid">

                <div class="secret-item">
                    <div class="name">VAULT_PASSWORD</div>
                    <input id="s_vault_password" type="password" placeholder="مقدار جدید">
                </div>

                <div class="secret-item">
                    <div class="name">DASHBOARD_TOKEN</div>
                    <input id="s_dashboard" type="password" placeholder="مقدار جدید">
                </div>

                <div class="secret-item">
                    <div class="name">RADIO_TOKEN</div>
                    <input id="s_radio" type="password" placeholder="مقدار جدید">
                </div>

                <div class="secret-item">
                    <div class="name">VAULT_TOKEN</div>
                    <input id="s_vault_token" type="password" placeholder="مقدار جدید">
                </div>

            </div>

            <div class="row">
                <button class="btn goldBtn" onclick="saveSecrets()">
                    <i class="bi bi-cloud-arrow-up"></i>
                    ذخیره Secrets
                </button>
            </div>

            <div id="secretStatus" class="status"></div>

        </div>

    </div>

</div>

<div class="footer">
    HPanel Vault
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.15/dist/modules/libsodium-wrappers.js"></script>

<script>
const CONFIG = {
    owner: "HerculePanel",
    repo: "vault",
    branch: "main",
    workflow: "built-vault.yml",
    vaultFile: "vault.enc.json"
};

const AUTH_KEY = "hpanel_auth";
const ITEMS_KEY = "hpanel_vault_items";
const VAULT_TOKEN_KEY = "hpanel_vault_token";

let token = "";
let admin = false;
let items = [];

/* ---------- helpers ---------- */

function $(id){
    return document.getElementById(id);
}

function setStatus(id,msg,type="muted"){
    const el=$(id);
    if(!el)return;
    el.textContent=msg;
    el.className="status "+type;
}

function escapeHtml(str){
    return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

async function github(url,options={}){
    options.headers={
        ...(options.headers||{}),
        "Authorization":"Bearer "+token,
        "Accept":"application/vnd.github+json",
        "X-GitHub-Api-Version":"2022-11-28"
    };

    const r=await fetch(url,options);

    let data={};

    try{
        data=await r.json();
    }catch{}

    if(!r.ok){
        throw new Error(
            data.message ||
            ("GitHub API error: "+r.status)
        );
    }

    return data;
}

/* ---------- encrypted vault ---------- */

async function downloadVault(){

    const url=
        `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${CONFIG.vaultFile}?t=${Date.now()}`;

    const r=await fetch(url);

    if(!r.ok){
        throw new Error("فایل Vault پیدا نشد");
    }

    return await r.json();
}

async function decryptVault(password){

    const vault=await downloadVault();

    if(!vault.salt || !vault.blob){
        throw new Error("ساختار vault.enc.json خراب است");
    }

    const salt=Uint8Array.from(
        atob(vault.salt),
        c=>c.charCodeAt(0)
    );

    const blob=Uint8Array.from(
        atob(vault.blob),
        c=>c.charCodeAt(0)
    );

    const key=await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveBits"]
    );

    const bits=await crypto.subtle.deriveBits(
        {
            name:"PBKDF2",
            salt:salt,
            iterations:100000,
            hash:"SHA-256"
        },
        key,
        256
    );

    const keyBytes=new Uint8Array(bits);

    const raw=new Uint8Array(blob.length);

    for(let i=0;i<blob.length;i++){
        raw[i]=blob[i]^keyBytes[i%32];
    }

    const text=new TextDecoder().decode(raw);

    try{
        return JSON.parse(text);
    }catch{
        throw new Error("رمز ورود اشتباه است");
    }
}

/* ---------- login ---------- */

async function login(){

    const password=$("password").value;

    if(!password){
        setStatus("loginStatus","رمز ورود را وارد کنید","error");
        return;
    }

    setStatus("loginStatus","در حال بررسی...","muted");

    try{

        const data=await decryptVault(password);

        admin=false;
        items=data.items || [];

        /*
         * Admin password:
         * base password + "_thisisadmin"
         */

        const dispatch=data.dispatch || "";

        if(dispatch){
            admin=true;

            /*
             * IMPORTANT:
             * Keep the admin token so refreshes continue
             * to work with GitHub API.
             */
            token=dispatch;

            localStorage.setItem(
                VAULT_TOKEN_KEY,
                dispatch
            );

            localStorage.setItem(
                ITEMS_KEY,
                JSON.stringify(items)
            );
        }

        $("loginBox").classList.add("hidden");
        $("panel").classList.remove("hidden");

        if(admin){

            $("sessionStatus").textContent=
                "با حساب مدیر وارد شده‌اید";

            $("adminSection").classList.remove("hidden");

        }else{

            $("sessionStatus").textContent=
                "با موفقیت وارد شدید";

            $("adminSection").classList.add("hidden");
        }

        $("password").value="";

        setStatus("loginStatus","");

    }catch(err){

        setStatus(
            "loginStatus",
            err.message || "ورود ناموفق بود",
            "error"
        );
    }
}

/* ---------- restore session ---------- */

function restoreSession(){

    const auth=localStorage.getItem(AUTH_KEY);

    /*
     * Admin token is saved separately.
     */
    const savedToken=
        localStorage.getItem(VAULT_TOKEN_KEY);

    const savedItems=
        localStorage.getItem(ITEMS_KEY);

    if(savedItems){
        try{
            items=JSON.parse(savedItems)||[];
        }catch{
            items=[];
        }
    }

    /*
     * Only restore admin session when the admin token exists.
     */
    if(savedToken){

        token=savedToken;
        admin=true;

        $("loginBox").classList.add("hidden");
        $("panel").classList.remove("hidden");
        $("adminSection").classList.remove("hidden");

        $("sessionStatus").textContent=
            "جلسه مدیر بازیابی شد";

        return;
    }

    /*
     * Normal authentication from shared HPanel auth.
     * Normal users do not receive API access.
     */
    if(auth){

        try{

            const a=JSON.parse(auth);

            if(a && a.loggedIn){

                $("loginBox").classList.add("hidden");
                $("panel").classList.remove("hidden");

                $("sessionStatus").textContent=
                    "شما وارد شده‌اید";

            }

        }catch{}
    }
}

/* ---------- tokens ---------- */

function showTokens(){

    if(!admin){
        return;
    }

    const box=$("tokenList");

    box.innerHTML="";

    if(!items.length){

        box.innerHTML=
            `<div class="muted">توکنی ذخیره نشده است.</div>`;

    }else{

        items.forEach(item=>{

            const div=document.createElement("div");

            div.className="token-box";

            div.innerHTML=`
                <div class="token-name">
                    ${escapeHtml(item.name)}
                </div>
                <div class="token">
                    ${escapeHtml(item.token || "(خالی)")}
                </div>
            `;

            box.appendChild(div);

        });
    }

    $("tokens").classList.remove("hidden");
}

/* ---------- secrets ---------- */

function openSecrets(){

    if(!admin)return;

    $("secretEditor").classList.toggle("hidden");
}

async function getPublicKey(){

    const url=
        `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/actions/secrets/public-key`;

    return await github(url);
}

async function encryptSecret(value,publicKey){

    await sodium.ready;

    const keyBytes=
        sodium.from_base64(
            publicKey.key,
            sodium.base64_variants.ORIGINAL
        );

    const encrypted=
        sodium.crypto_box_seal(
            new TextEncoder().encode(value),
            keyBytes
        );

    return sodium.to_base64(
        encrypted,
        sodium.base64_variants.ORIGINAL
    );
}

async function updateSecret(name,value,publicKey){

    const encrypted=
        await encryptSecret(
            value,
            publicKey
        );

    const url=
        `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/actions/secrets/${name}`;

    await github(url,{
        method:"PUT",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            encrypted_value:encrypted,
            key_id:publicKey.key_id
        })
    });
}

async function saveSecrets(){

    if(!admin){
        return;
    }

    const values={
        VAULT_PASSWORD:$("s_vault_password").value,
        DASHBOARD_TOKEN:$("s_dashboard").value,
        RADIO_TOKEN:$("s_radio").value,
        VAULT_TOKEN:$("s_vault_token").value
    };

    const changed=
        Object.values(values).some(v=>v.length>0);

    if(!changed){

        setStatus(
            "secretStatus",
            "حداقل یک Secret را وارد کنید",
            "error"
        );

        return;
    }

    setStatus(
        "secretStatus",
        "در حال اتصال به GitHub...",
        "muted"
    );

    try{

        const publicKey=
            await getPublicKey();

        const names=
            Object.keys(values);

        let count=0;

        for(const name of names){

            const value=values[name];

            /*
             * Empty fields are ignored, so you can change
             * only one Secret without touching the others.
             */
            if(!value)continue;

            setStatus(
                "secretStatus",
                `در حال ذخیره ${name}...`,
                "muted"
            );

            await updateSecret(
                name,
                value,
                publicKey
            );

            count++;
        }

        /*
         * If VAULT_TOKEN was changed, use the new token
         * immediately and persist it.
         */
        if(values.VAULT_TOKEN){

            token=values.VAULT_TOKEN;

            localStorage.setItem(
                VAULT_TOKEN_KEY,
                values.VAULT_TOKEN
            );
        }

        $("s_vault_password").value="";
        $("s_dashboard").value="";
        $("s_radio").value="";
        $("s_vault_token").value="";

        setStatus(
            "secretStatus",
            `${count} Secret با موفقیت ذخیره شد`,
            "success"
        );

    }catch(err){

        setStatus(
            "secretStatus",
            err.message || "ذخیره Secrets ناموفق بود",
            "error"
        );
    }
}

/* ---------- workflow ---------- */

async function buildVault(){

    if(!admin){
        return;
    }

    if(!confirmBuild()){
        return;
    }

    try{

        setStatus(
            "sessionStatus",
            "در حال اجرای Build Vault...",
            "muted"
        );

        const url=
            `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/actions/workflows/${CONFIG.workflow}/dispatches`;

        await github(url,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                ref:CONFIG.branch
            })
        });

        setStatus(
            "sessionStatus",
            "Workflow با موفقیت اجرا شد",
            "success"
        );

    }catch(err){

        setStatus(
            "sessionStatus",
            err.message || "اجرای Workflow ناموفق بود",
            "error"
        );
    }
}

function confirmBuild(){

    return window.confirm(
        "Build Vault اجرا شود؟"
    );
}

/* ---------- logout ---------- */

function logout(){

    token="";
    admin=false;
    items=[];

    localStorage.removeItem(VAULT_TOKEN_KEY);
    localStorage.removeItem(ITEMS_KEY);

    $("panel").classList.add("hidden");
    $("loginBox").classList.remove("hidden");
    $("tokens").classList.add("hidden");
    $("adminSection").classList.add("hidden");
    $("secretEditor").classList.add("hidden");

    setStatus("loginStatus","");

    $("password").value="";
}

/* ---------- enter key ---------- */

$("password").addEventListener(
    "keydown",
    e=>{
        if(e.key==="Enter"){
            login();
        }
    }
);

/* ---------- startup ---------- */

restoreSession();

</script>

</body>
</html>
