<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPanel Vault</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<style>
:root{
--bg:#0b0a09;
--text:#fff6ea;
--muted:#c3b09a;
--line:rgba(255,186,92,.22);
--gold:#ffb43a;
--mint:#3ee39a;
--ink:#140f0a
}

*{
box-sizing:border-box
}

body{
margin:0;
min-height:100vh;
font-family:Lalezar,Tahoma;
color:var(--text);
background:
radial-gradient(circle at 12% 0%,rgba(255,180,58,.20),transparent 32%),
radial-gradient(circle at 88% 30%,rgba(62,227,154,.09),transparent 30%),
linear-gradient(180deg,#120e0b,#070605);
overflow-x:hidden
}

/* ---------------- Layout ---------------- */

.wrap{
width:min(610px,calc(100% - 26px));
margin:auto;
padding:34px 0 45px;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh
}

.card{
width:100%;
padding:18px;
border-radius:19px;
border:1px solid var(--line);
background:
linear-gradient(
145deg,
rgba(255,255,255,.085),
rgba(255,180,58,.050),
rgba(255,255,255,.020)
);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
box-shadow:
0 24px 60px rgba(0,0,0,.48),
inset 0 1px 0 rgba(255,255,255,.08);
text-align:center;
animation:cardIn .55s cubic-bezier(.22,1,.36,1)
}

@keyframes cardIn{
from{
opacity:0;
transform:translateY(14px) scale(.98)
}
to{
opacity:1;
transform:none
}
}

/* ---------------- Brand ---------------- */

.brand{
font-size:29px;
line-height:1.1;
margin:0 0 7px
}

.gold{
color:var(--gold)
}

.subtitle{
font-size:15px;
margin:0 0 15px
}

.muted{
color:var(--muted)
}

/* ---------------- Login ---------------- */

.login-area{
max-width:430px;
margin:auto
}

.input-wrap{
position:relative;
margin:12px 0
}

.input-wrap .bi{
position:absolute;
right:11px;
top:50%;
transform:translateY(-50%);
font-size:15px;
color:var(--gold);
pointer-events:none
}

input{
width:100%;
padding:9px 36px 9px 10px;
border-radius:11px;
border:1px solid var(--line);
background:rgba(255,255,255,.05);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
color:var(--text);
font:14px Lalezar;
outline:none
}

input:focus{
border-color:rgba(255,180,58,.55);
box-shadow:0 0 0 3px rgba(255,180,58,.08)
}

/* ---------------- Buttons ---------------- */

.btn{
border:0;
cursor:pointer;
border-radius:13px;
padding:9px 14px;
font:14px Lalezar;
margin:3px;
box-shadow:0 4px 0 rgba(0,0,0,.28);
text-decoration:none;
display:inline-flex;
align-items:center;
justify-content:center;
gap:4px
}

.goldbtn{
background:linear-gradient(180deg,#ffd27a,#ff9d1f);
color:var(--ink)
}

.mint{
background:linear-gradient(180deg,#6af3b8,#17c77a);
color:#042016
}

.ghost{
background:rgba(255,255,255,.055);
color:var(--text);
border:1px solid var(--line);
box-shadow:none
}

.rose{
background:linear-gradient(180deg,#ff8a97,#e23b4d);
color:#fff
}

.btn:disabled{
opacity:.55;
cursor:wait
}

/* ---------------- Status ---------------- */

.status{
margin:10px 0 0;
color:var(--muted);
font-size:13px;
min-height:20px
}

.session-status{
padding:9px 11px;
margin:11px auto;
max-width:470px;
border-radius:12px;
background:rgba(255,255,255,.035);
border:1px solid rgba(255,186,92,.10);
color:var(--muted);
font-size:14px
}

/* ---------------- Actions ---------------- */

.actions{
display:flex;
justify-content:center;
align-items:center;
flex-wrap:wrap;
gap:3px;
margin-top:10px
}

/* ---------------- Token Viewer ---------------- */

.token-panel{
margin:14px auto 4px;
max-width:520px;
text-align:right;
padding:12px;
border-radius:15px;
background:rgba(255,255,255,.035);
border:1px solid var(--line);
animation:tokenIn .4s cubic-bezier(.22,1,.36,1)
}

@keyframes tokenIn{
from{
opacity:0;
transform:translateY(8px)
}
to{
opacity:1;
transform:none
}
}

.token-heading{
margin:0 0 8px;
font-size:16px;
color:var(--gold)
}

.token-item{
margin:8px 0
}

.token-name{
font-size:14px;
margin-bottom:4px
}

.token{
direction:ltr;
text-align:left;
word-break:break-all;
padding:9px;
border-radius:10px;
background:rgba(255,255,255,.045);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
border:1px solid rgba(255,186,92,.10);
font-family:monospace;
font-size:11px;
line-height:1.5
}

.no-token{
font-size:13px;
color:var(--muted)
}

/* ---------------- Spinner ---------------- */

.spinner{
display:inline-block;
width:14px;
height:14px;
border:2px solid rgba(0,0,0,.22);
border-top-color:#111;
border-radius:50%;
animation:spin .7s linear infinite;
vertical-align:-3px
}

@keyframes spin{
to{
transform:rotate(360deg)
}
}

/* ---------------- Toast ---------------- */

.toast{
position:fixed;
bottom:18px;
left:50%;
transform:translate(-50%,20px) scale(.96);
padding:10px 15px;
border-radius:11px;
background:rgba(23,18,13,.72);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid var(--line);
box-shadow:
0 16px 40px rgba(0,0,0,.35),
inset 0 1px 0 rgba(255,255,255,.06);
z-index:200;
opacity:0;
animation:toastIn .45s cubic-bezier(.22,1,.36,1) forwards;
font-size:13px
}

.toast.hide{
animation:toastOut .45s cubic-bezier(.55,0,.78,.18) forwards
}

@keyframes toastIn{
to{
opacity:1;
transform:translate(-50%,0) scale(1)
}
}

@keyframes toastOut{
to{
opacity:0;
transform:translate(-50%,15px) scale(.94)
}
}

.ok{
color:#9dffc9
}

.err{
color:#ffb0b7
}

/* ---------------- General ---------------- */

button,
a,
input{
transition:
transform .35s cubic-bezier(.22,1,.36,1),
opacity .35s ease,
border-color .35s ease,
box-shadow .35s ease,
background .35s ease
}

button:not(:disabled):hover,
a.btn:hover{
transform:translateY(-2px)
}

.hidden{
display:none!important
}

.bi{
display:inline-block;
vertical-align:-.12em
}

/* ---------------- Custom Dialog ---------------- */

.custom-dialog{
position:fixed;
inset:0;
background:rgba(8,6,4,.68);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
display:flex;
align-items:center;
justify-content:center;
z-index:150;
animation:dialogIn .3s cubic-bezier(.22,1,.36,1)
}

.custom-dialog.hidden{
display:none
}

.custom-dialog.closing{
animation:dialogOut .3s cubic-bezier(.55,0,.78,.18) forwards
}

.custom-dialog-box{
width:min(450px,calc(100% - 26px));
padding:17px;
border-radius:17px;
border:1px solid var(--line);
background:rgba(22,17,12,.80);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
box-shadow:
0 25px 70px rgba(0,0,0,.55),
inset 0 1px 0 rgba(255,255,255,.08);
animation:dialogBoxIn .35s cubic-bezier(.22,1,.36,1)
}

.custom-dialog.closing .custom-dialog-box{
animation:dialogBoxOut .3s cubic-bezier(.55,0,.78,.18) forwards
}

.dialog-title{
margin:0 0 7px;
font-size:20px
}

.dialog-message{
color:var(--muted);
line-height:1.8;
font-size:13px;
white-space:pre-wrap
}

.dialog-icon{
font-size:21px;
vertical-align:-.12em;
margin-inline-end:6px
}

.dialog-actions{
display:flex;
gap:5px;
flex-wrap:wrap;
margin-top:13px
}

@keyframes dialogIn{
from{opacity:0}
to{opacity:1}
}

@keyframes dialogOut{
from{opacity:1}
to{opacity:0}
}

@keyframes dialogBoxIn{
from{
opacity:0;
transform:translateY(15px) scale(.97)
}
to{
opacity:1;
transform:none
}
}

@keyframes dialogBoxOut{
to{
opacity:0;
transform:translateY(13px) scale(.97)
}
}

/* ---------------- Mobile ---------------- */

@media(max-width:520px){

.wrap{
width:calc(100% - 18px);
padding:18px 0
}

.card{
padding:15px;
border-radius:17px
}

.brand{
font-size:25px
}

.subtitle{
font-size:14px
}

.btn{
font-size:13px;
padding:8px 11px;
border-radius:11px
}

input{
font-size:13px;
padding:8px 34px 8px 9px
}

.session-status{
font-size:13px
}

.token{
font-size:10px
}

}
</style>
</head>

<body>

<div class="wrap">

<!-- ================= Login Card ================= -->

<div id="loginCard" class="card">

<div class="login-area">

<!-- Brand: H, P and V are gold -->
<h1 class="brand">
<span class="gold">H</span><span class="gold">P</span>anel
<span class="gold">V</span>ault
</h1>

<p class="subtitle muted">
رمز گاوصندوق را وارد کنید
</p>

<div class="input-wrap">

<i class="bi bi-key-fill"></i>

<input
id="pass"
type="password"
placeholder="رمز ورود"
autocomplete="current-password"
>

</div>

<button
id="login"
class="btn goldbtn"
onclick="unlock()"
>
<i class="bi bi-unlock"></i>
ورود
</button>

<p id="status" class="status"></p>

</div>

</div>


<!-- ================= Session Card ================= -->

<div id="sessionCard" class="card hidden">

<!-- Brand: H, P and V are gold -->
<h1 class="brand">
<span class="gold">H</span><span class="gold">P</span>anel
<span class="gold">V</span>ault
</h1>

<div
id="sessionText"
class="session-status"
></div>

<div class="actions">

<button
class="btn rose"
onclick="askLogout()"
>
<i class="bi bi-box-arrow-right"></i>
بله، خروج
</button>

<button
class="btn ghost"
onclick="cancelLogout()"
>
<i class="bi bi-x-lg"></i>
خیر
</button>

<button
id="viewBtn"
class="btn goldbtn hidden"
onclick="showTokens()"
>
<i class="bi bi-key"></i>
مشاهده توکن‌ها
</button>

</div>


<!-- Token Viewer -->

<div
id="tokens"
class="token-panel hidden"
></div>


<div style="margin-top:13px">

<a
class="btn mint"
href="https://herculepanel.github.io/"
>
<i class="bi bi-house"></i>
منوی اصلی
</a>

</div>

</div>

</div>


<!-- ================= Custom Dialog ================= -->

<div
id="customDialog"
class="custom-dialog hidden"
>

<div class="custom-dialog-box">

<h2
id="dialogTitle"
class="dialog-title"
></h2>

<div
id="dialogMessage"
class="dialog-message"
></div>

<div
id="dialogActions"
class="dialog-actions"
></div>

</div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const CONFIG={
vaultFile:"vault.enc.json"
};

const AUTH_KEY="hpanel_auth";

/*
 * Stores the admin's decrypted Vault items so that
 * the token viewer can work after reopening the page.
 *
 * This is only populated for admin sessions and is
 * deleted during logout.
 */
const ADMIN_ITEMS_KEY="hpanel_vault_items";

const KEYS={
dash:"hpanel_dashboard_token",
radio:"hpanel_radio_token"
};

let current=null;
let items=[];
let password="";


/* =========================================================
   Toast
========================================================= */

function toast(t,c=""){

const x=document.createElement("div");

x.className="toast "+c;

x.textContent=t;

document.body.appendChild(x);

setTimeout(()=>{

x.classList.add("hide");

setTimeout(()=>{
x.remove();
},450);

},3200);

}


/* =========================================================
   Custom Dialog
========================================================= */

function closeCustomDialog(){

const d=document.getElementById("customDialog");

if(d.classList.contains("hidden"))return;

d.classList.add("closing");

setTimeout(()=>{

d.classList.add("hidden");
d.classList.remove("closing");

},300);

}


function customAlert(
message,
title="پیام",
type="info"
){

return new Promise(resolve=>{

const d=document.getElementById("customDialog");
const t=document.getElementById("dialogTitle");
const m=document.getElementById("dialogMessage");
const a=document.getElementById("dialogActions");

const icons={
info:"bi-info-circle",
success:"bi-check-circle",
error:"bi-exclamation-triangle",
warning:"bi-exclamation-triangle"
};

const buttonClass=
type==="error"||type==="warning"
?"rose"
:"mint";

t.innerHTML=
`<i class="bi ${icons[type]||icons.info} dialog-icon"></i>${esc(title)}`;

m.textContent=message;

a.innerHTML=`

<button
class="btn ${buttonClass}"
id="dialogOK"
>
<i class="bi bi-check-lg"></i>
باشه
</button>

`;

d.classList.remove("hidden","closing");

document.getElementById("dialogOK").onclick=()=>{

closeCustomDialog();

setTimeout(()=>{
resolve();
},300);

};

});

}


function customConfirm(
message,
title="تأیید"
){

return new Promise(resolve=>{

const d=document.getElementById("customDialog");
const t=document.getElementById("dialogTitle");
const m=document.getElementById("dialogMessage");
const a=document.getElementById("dialogActions");

t.innerHTML=
`<i class="bi bi-question-circle dialog-icon"></i>${esc(title)}`;

m.textContent=message;

a.innerHTML=`

<button
class="btn mint"
id="dialogYes"
>
<i class="bi bi-check-lg"></i>
بله
</button>

<button
class="btn ghost"
id="dialogNo"
>
<i class="bi bi-x-lg"></i>
خیر
</button>

`;

d.classList.remove("hidden","closing");


document.getElementById("dialogYes").onclick=()=>{

closeCustomDialog();

setTimeout(()=>{
resolve(true);
},300);

};


document.getElementById("dialogNo").onclick=()=>{

closeCustomDialog();

setTimeout(()=>{
resolve(false);
},300);

};

});

}


/* =========================================================
   Base64
========================================================= */

function b64(s){

const bin=atob(s);

const a=new Uint8Array(bin.length);

for(let i=0;i<bin.length;i++)
a[i]=bin.charCodeAt(i);

return a;

}


/* =========================================================
   Encryption
========================================================= */

async function keyFor(p,salt){

const m=
await crypto.subtle.importKey(
"raw",
new TextEncoder().encode(p),
"PBKDF2",
false,
["deriveBits"]
);

const bits=
await crypto.subtle.deriveBits(
{
name:"PBKDF2",
salt,
iterations:100000,
hash:"SHA-256"
},
m,
256
);

return new Uint8Array(bits);

}


async function decrypt(p,pack){

const k=
await keyFor(
p,
b64(pack.salt)
);

const b=
b64(pack.blob);

const raw=
new Uint8Array(b.length);

for(let i=0;i<b.length;i++)
raw[i]=b[i]^k[i%32];

return JSON.parse(
new TextDecoder().decode(raw)
);

}


async function loadPack(){

const r=
await fetch(
CONFIG.vaultFile+"?t="+Date.now(),
{
cache:"no-store"
}
);

if(!r.ok)
throw Error("فایل Vault پیدا نشد");

return r.json();

}


/* =========================================================
   Authentication Storage
========================================================= */

function saveAuth(admin,data){

localStorage.setItem(
AUTH_KEY,
JSON.stringify({
loggedIn:true,
admin:!!admin,
at:Date.now()
})
);


/*
 * Dashboard and Radio tokens are stored separately
 * because the other HPanel pages use these keys.
 */

if(data?.items){

for(const x of data.items){

if(!x||!x.token)continue;

const n=
String(x.name||"").toLowerCase();

if(n.includes("radio"))

localStorage.setItem(
KEYS.radio,
x.token
);

else if(n.includes("dash"))

localStorage.setItem(
KEYS.dash,
x.token
);

}


/*
 * IMPORTANT FIX:
 *
 * Admin token data is saved so that the token viewer
 * still has its data after reopening the Vault page.
 */

if(admin){

try{

localStorage.setItem(
ADMIN_ITEMS_KEY,
JSON.stringify(data.items||[])
);

}catch{

console.warn(
"Could not save admin Vault items"
);

}

}

}

}


/* =========================================================
   Restore Admin Items
========================================================= */

function restoreAdminItems(){

try{

const raw=
localStorage.getItem(
ADMIN_ITEMS_KEY
);

if(!raw)return [];

const parsed=
JSON.parse(raw);

return Array.isArray(parsed)
?parsed
:[];

}catch{

return [];

}

}


/* =========================================================
   Get Auth
========================================================= */

function getAuth(){

try{

return JSON.parse(
localStorage.getItem(
AUTH_KEY
)||"null"
);

}catch{

return null;

}

}


/* =========================================================
   Session
========================================================= */

function showSession(a){

current=a;

document
.getElementById("loginCard")
.classList
.add("hidden");

document
.getElementById("sessionCard")
.classList
.remove("hidden");


document
.getElementById("sessionText")
.textContent=
a.admin
?"شما به عنوان مدیر وارد شده‌اید. از حساب خارج شوید؟"
:"شما وارد شده‌اید. از حساب خارج شوید؟";


document
.getElementById("viewBtn")
.classList
.toggle(
"hidden",
!a.admin
);


/*
 * If this is an admin session, restore the token
 * data saved from the previous successful login.
 */

if(a.admin){

items=restoreAdminItems();

}

}


/* =========================================================
   Login
========================================================= */

async function unlock(){

const entered=
document
.getElementById("pass")
.value
.trim();


if(!entered){

toast(
"رمز را وارد کن",
"err"
);

return;

}


const admin=
entered.endsWith("_thisisadmin");


const base=
admin
?entered.slice(
0,
-"_thisisadmin".length
)
:entered;


const btn=
document.getElementById("login");

btn.disabled=true;

btn.innerHTML=
`
<i class="bi bi-hourglass-split"></i>
در حال بررسی
<span class="spinner"></span>
`;


try{

const pack=
await loadPack();

const data=
await decrypt(
base,
pack
);


items=
Array.isArray(data.items)
?data.items
:[];


/*
 * Save authentication state and token data.
 */

saveAuth(
admin,
data
);


/*
 * Keep the base password only in memory while
 * this page is open. It is NOT saved to localStorage.
 */

password=base;


showSession({
admin
});


toast(
"ورود موفق بود",
"ok"
);


}catch(e){

toast(
"رمز اشتباه است",
"err"
);

}finally{

btn.disabled=false;

btn.innerHTML=
`
<i class="bi bi-unlock"></i>
ورود
`;

}

}


/* =========================================================
   Logout
========================================================= */

async function askLogout(){

const confirmed=
await customConfirm(
"از حساب خارج شوید؟",
"خروج از حساب"
);

if(!confirmed)return;

logout();

}


function cancelLogout(){

toast(
"حساب شما همچنان وارد است"
);

}


function logout(){

localStorage.removeItem(
AUTH_KEY
);

localStorage.removeItem(
KEYS.dash
);

localStorage.removeItem(
KEYS.radio
);


/*
 * IMPORTANT:
 * Remove persisted admin token data when logging out.
 */

localStorage.removeItem(
ADMIN_ITEMS_KEY
);


current=null;
items=[];
password="";


document
.getElementById("tokens")
.classList
.add("hidden");

document
.getElementById("tokens")
.innerHTML="";


document
.getElementById("sessionCard")
.classList
.add("hidden");

document
.getElementById("loginCard")
.classList
.remove("hidden");


document
.getElementById("pass")
.value="";


toast(
"خارج شدی",
"ok"
);

}


/* =========================================================
   Token Viewer
========================================================= */

function showTokens(){

if(!current?.admin)return;


/*
 * If the in-memory list is empty, try restoring it.
 * This fixes the page-reopen case.
 */

if(!items.length){

items=restoreAdminItems();

}


const box=
document.getElementById("tokens");


box.classList.remove("hidden");


box.innerHTML=`

<h3 class="token-heading">
<i class="bi bi-key-fill"></i>
توکن‌های ذخیره‌شده
</h3>

${
items.length

?items.map(x=>`

<div class="token-item">

<div class="token-name">

<b>
<i class="bi bi-key"></i>
${esc(x.name||"توکن")}
</b>

</div>

<div class="token">
${esc(x.token||"")}
</div>

</div>

`).join("")

:`

<p class="no-token">
<i class="bi bi-info-circle"></i>
توکنی پیدا نشد.
</p>

`

}

`;

}


/* =========================================================
   Escape
========================================================= */

function esc(s){

return String(s??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================================
   Startup
========================================================= */

(async()=>{

const a=getAuth();


if(a?.loggedIn){

/*
 * Restore admin token data immediately.
 */

if(a.admin){

items=restoreAdminItems();

}


showSession(a);

}

})();


/* =========================================================
   Enter Key
========================================================= */

document
.getElementById("pass")
.addEventListener(
"keydown",
e=>{

if(e.key==="Enter")
unlock();

}
);

</script>

</body>
 </html>
