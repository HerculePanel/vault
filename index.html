<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HerculePanel Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a09;--text:#fff6ea;--muted:#c3b09a;--line:rgba(255,186,92,.22);--gold:#ffb43a;--mint:#3ee39a;--ink:#140f0a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Lalezar,Tahoma;color:var(--text);background:radial-gradient(circle at 12% 0%,rgba(255,180,58,.18),transparent 32%),linear-gradient(180deg,#120e0b,#070605)}
.wrap{width:min(720px,calc(100% - 30px));margin:auto;padding:55px 0}
.card{padding:22px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 28px 70px rgba(0,0,0,.55);text-align:center;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fadeOut{from{opacity:1;transform:translateX(-50%) translateY(0)}to{opacity:0;transform:translateX(-50%) translateY(20px)}}
.gold{color:var(--gold)}input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.38);color:var(--text);font:16px Lalezar;outline:none}.btn{border:0;cursor:pointer;border-radius:16px;padding:12px 18px;font:16px Lalezar;margin:5px;box-shadow:0 5px 0 rgba(0,0,0,.3)}.goldbtn{background:linear-gradient(180deg,#ffd27a,#ff9d1f);color:var(--ink)}.mint{background:linear-gradient(180deg,#6af3b8,#17c77a);color:#042016}.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);box-shadow:none}.rose{background:linear-gradient(180deg,#ff8a97,#e23b4d);color:#fff}.hidden{display:none!important}.muted{color:var(--muted)}.status{margin:14px 0;color:var(--muted);min-height:28px}.token{direction:ltr;text-align:left;word-break:break-all;padding:10px;border-radius:11px;background:rgba(0,0,0,.3);margin:8px 0}.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.actions{display:flex;justify-content:center;flex-wrap:wrap}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:12px;background:#17120d;border:1px solid var(--line);z-index:5;animation:slideUp .3s ease}.toast.removing{animation:fadeOut .3s ease forwards}.ok{color:#9dffc9}.err{color:#ffb0b7}
button,a,input{transition:transform .18s ease,opacity .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease}button:not(:disabled):hover,a.btn:hover{transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap">
<div id="loginCard" class="card">
<h1><span class="gold">H</span>ercule<span class="gold">P</span>anel <span class="gold">V</span>ault</h1>
<p class="muted">رمز گاوصندوق را وارد کنید</p>
<input id="pass" type="password" placeholder="رمز ورود" autocomplete="current-password">
<button id="login" class="btn goldbtn" onclick="unlock()">ورود</button>
<p id="status" class="status"></p>
</div>
<div id="sessionCard" class="card hidden">
<h1><span class="gold">H</span>ercule<span class="gold">P</span>anel <span class="gold">V</span>ault</h1>
<p id="sessionText" class="muted"></p>
<div class="actions">
<button class="btn rose" onclick="askLogout()">بله، خروج</button>
<button class="btn ghost" onclick="cancelLogout()">خیر</button>
<button id="viewBtn" class="btn goldbtn hidden" onclick="showTokens()">مشاهده توکن‌ها</button>
</div>
<div id="tokens" class="hidden"></div>
<br>
<a class="btn mint" href="https://herculepanel.github.io/">منوی اصلی</a>
</div>
</div>
<script>
const CONFIG={vaultFile:"vault.enc.json"};
const AUTH_KEY="hpanel_auth";
const KEYS={dash:"hpanel_dashboard_token",radio:"hpanel_radio_token"};
let current=null,items=[],password="";
function toast(t,c=""){const x=document.createElement("div");x.className="toast "+c;x.textContent=t;document.body.appendChild(x);setTimeout(()=>{x.classList.add("removing");setTimeout(()=>x.remove(),300)},2800)}
function b64(s){const bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function keyFor(p,salt){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:100000,hash:"SHA-256"},m,256);return new Uint8Array(bits)}
async function decrypt(p,pack){const k=await keyFor(p,b64(pack.salt)),b=b64(pack.blob),raw=new Uint8Array(b.length);for(let i=0;i<b.length;i++)raw[i]=b[i]^k[i%32];return JSON.parse(new TextDecoder().decode(raw))}
async function loadPack(){const r=await fetch(CONFIG.vaultFile+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("فایل Vault پیدا نشد");return r.json()}
function saveAuth(admin,data){localStorage.setItem(AUTH_KEY,JSON.stringify({loggedIn:true,admin:!!admin,at:Date.now()}));if(data?.items){for(const x of data.items){if(!x||!x.token)continue;const n=String(x.name||"").toLowerCase();if(n.includes("radio"))localStorage.setItem(KEYS.radio,x.token);else if(n.includes("dash"))localStorage.setItem(KEYS.dash,x.token)}}}
function getAuth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||"null")}catch{return null}}
function showSession(a){current=a;document.getElementById("loginCard").classList.add("hidden");document.getElementById("sessionCard").classList.remove("hidden");document.getElementById("sessionText").textContent=a.admin?"شما به عنوان مدیر وارد شده‌اید. از حساب خارج شوید؟":"شما وارد شده‌اید. از حساب خارج شوید؟";document.getElementById("viewBtn").classList.toggle("hidden",!a.admin)}
async function unlock(){
 const entered=document.getElementById("pass").value.trim();if(!entered)return toast("رمز را وارد کن","err");
 const admin=entered.endsWith("_thisisadmin"),base=admin?entered.slice(0,-"_thisisadmin".length):entered;
 const btn=document.getElementById("login");btn.disabled=true;btn.innerHTML='در حال بررسی <span class="spinner"></span>';
 try{const pack=await loadPack();const data=await decrypt(base,pack);items=Array.isArray(data.items)?data.items:[];saveAuth(admin,data);showSession({admin});toast("ورود موفق بود","ok");}
 catch(e){toast("رمز اشتباه است","err")}finally{btn.disabled=false;btn.textContent="ورود"}
}
function askLogout(){if(!confirm("از حساب خارج شوید؟"))return;logout()}
function cancelLogout(){toast("حساب شما همچنان وارد است")}
function logout(){localStorage.removeItem(AUTH_KEY);localStorage.removeItem(KEYS.dash);localStorage.removeItem(KEYS.radio);current=null;items=[];document.getElementById("tokens").classList.add("hidden");document.getElementById("tokens").innerHTML="";document.getElementById("sessionCard").classList.add("hidden");document.getElementById("loginCard").classList.remove("hidden");document.getElementById("pass").value="";toast("خارج شدی")}
function showTokens(){if(!current?.admin)return;const box=document.getElementById("tokens");box.classList.remove("hidden");box.innerHTML=items.length?items.map(x=>'<div><b>'+String(x.name||"توکن")+'</b><div class="token">'+String(x.token||"")+'</div></div>').join(""):"<p class='muted'>توکنی پیدا نشد.</p>"}
(async()=>{const a=getAuth();if(a?.loggedIn)showSession(a)})();
document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
</script>
</body></html>
