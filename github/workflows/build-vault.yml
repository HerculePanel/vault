name: Build vault file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Encrypt tokens into vault.enc.json
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          RADIO_TOKEN: ${{ secrets.RADIO_TOKEN }}
        run: |
          set -e
          python3 - <<'PY'
          import base64, hashlib, json, os
          password = os.environ.get("VAULT_PASSWORD") or ""
          dash = os.environ.get("DASHBOARD_TOKEN") or ""
          radio = os.environ.get("RADIO_TOKEN") or ""
          if not password:
              raise SystemExit("VAULT_PASSWORD secret is empty")
          if not dash and not radio:
              raise SystemExit("DASHBOARD_TOKEN and RADIO_TOKEN are empty")
          payload = json.dumps({
              "items": [
                  {"name": "HPanel Dashboard v1.2", "token": dash},
                  {"name": "HPanel Radio", "token": radio}
              ]
          }, ensure_ascii=False)
          salt = os.urandom(16)
          key = hashlib.pbkdf2_hmac("sha256", password.encode("utf-8"), salt, 100000, 32)
          raw = payload.encode("utf-8")
          blob = bytes(b ^ key[i % 32] for i, b in enumerate(raw))
          out = {
              "v": 1,
              "salt": base64.b64encode(salt).decode("ascii"),
              "blob": base64.b64encode(blob).decode("ascii")
          }
          with open("vault.enc.json", "w", encoding="utf-8") as f:
              json.dump(out, f)
              f.write("\n")
          print("wrote vault.enc.json")
          PY

      - name: Commit vault.enc.json
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add vault.enc.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Update encrypted vault file"
          git push
